; ESP32-C3 Super Mini / Seeed XIAO ESP32-C3 + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" / "MakerGO ESP32 C3 SuperMini"
;                       or "XIAO_ESP32C3"
;
; Envs:
;   supermini  - ESP32-C3 Super Mini (default display pins baked into config.h)
;   xiao       - Seeed XIAO ESP32-C3 (display pins overridden below)
;
; Build:   pio run -e xiao          / pio run -e supermini
; Flash:   pio run -t upload -e xiao / pio run -t upload -e supermini
; Merge:   pio run -t merge -e xiao / pio run -t merge -e supermini

[env]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (both boards have native USB CDC)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; --- ESP32-C3 Super Mini (original board; uses config.h pin defaults) ---
[env:supermini]

; --- Seeed XIAO ESP32-C3 (primary target of this fork) ---
; XIAO ESP32-C3 pinout: MOSI=D10, SCLK=D8, DC=D1, CS=D4, RST=D3
[env:xiao]
build_flags =
  ${env.build_flags}
  -DCONFIG_DISPLAY_PIN_RST=5
  -DCONFIG_DISPLAY_PIN_CS=6
  -DCONFIG_DISPLAY_PIN_DC=3
  -DCONFIG_DISPLAY_PIN_MOSI=10
  -DCONFIG_DISPLAY_PIN_SCLK=8
